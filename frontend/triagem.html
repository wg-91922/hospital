<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triagem Hospitalar</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:20px}
.container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:12px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;border:1px solid #cbd5e1;border-radius:8px}
button{border:none;padding:12px 16px;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff}
.btn-salvar{background:#4f46e5;width:100%}
.btn-tv{background:#0ea5e9;margin-right:8px}
.btn-excluir{background:#dc2626}
.card{border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin:12px 0;background:#f8fafc}
</style>
</head>
<body>
<div class="container">
<h2>🩺 Triagem Hospitalar</h2>
  <div style="display:flex;gap:8px;margin-bottom:16px;">
  <a href="/tv.html" style="background:#2563eb;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:bold;">📺 Ir para Telão</a>
  <a href="/index.html" style="background:#e5e7eb;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:bold;">🏠 Início</a>
</div>
<label>Nome do paciente</label><input id="nome" placeholder="Nome do paciente">
<label>Sintoma</label><input id="sintoma" placeholder="Ex: febre, dor de cabeça">
<label>Temperatura</label><input id="temperatura" placeholder="Ex: 38.5">
<label>Alergia</label><input id="alergia" placeholder="Ex: nenhuma">
<label>Observação</label><textarea id="observacao" rows="3"></textarea>
<label>Risco</label>
<select id="risco">
<option value="verde">VERDE</option>
<option value="amarelo">AMARELO</option>
<option value="vermelho">VERMELHO</option>
</select>
<button class="btn-salvar" onclick="salvarTriagem()">Salvar Triagem</button>
<div id="mensagem"></div>
<hr>
<h3>📋 Pacientes da Triagem</h3>
<div id="lista">Carregando...</div>
</div>
<script>
async function salvarTriagem(){
  const nome=document.getElementById("nome").value.trim();
  const sintoma=document.getElementById("sintoma").value.trim();
  const temperatura=document.getElementById("temperatura").value.trim();
  const alergia=document.getElementById("alergia").value.trim();
  const observacao=document.getElementById("observacao").value.trim();
  const risco=document.getElementById("risco").value;
  if(!nome){alert("Informe o nome do paciente");return;}
  try{
    const r=await fetch("/triagem",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome,sintoma,temperatura,alergia,observacao,risco})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.erro||"Erro ao salvar");
    document.getElementById("mensagem").textContent="Classificação registrada: "+risco.toUpperCase();
    document.getElementById("nome").value="";document.getElementById("sintoma").value="";document.getElementById("temperatura").value="";document.getElementById("alergia").value="";document.getElementById("observacao").value="";
    carregar();
  }catch(e){alert(e.message);}
}
async function carregar(){
  try{
    const r=await fetch("/triagens");
    const lista=await r.json();
    const div=document.getElementById("lista");
    div.innerHTML="";
    if(!lista.length){div.innerHTML="<p>Nenhum paciente na triagem.</p>";return;}
    lista.forEach(t=>{
      const card=document.createElement("div");card.className="card";
      const nome=document.createElement("h3");nome.textContent="👤 "+(t.nome||"Paciente");
      const s=document.createElement("p");s.textContent="Sintoma: "+(t.sintoma||"Não informado");
      const c=document.createElement("p");c.textContent="Classificação: "+(t.risco||"verde").toUpperCase();
      const st=document.createElement("p");st.textContent="Status: "+(t.status||"aguardando_medico");
      const btnTv=document.createElement("button");btnTv.className="btn-tv";btnTv.textContent="📺 CHAMAR NO TELÃO";
      btnTv.onclick=()=>chamarTv(t.nome);
      const btnExcluir=document.createElement("button");btnExcluir.className="btn-excluir";btnExcluir.textContent="🗑️ EXCLUIR";
      btnExcluir.onclick=()=>excluirPaciente(t.id,t.nome);
      card.append(nome,s,c,st,btnTv,btnExcluir);
      div.appendChild(card);
    });
  }catch(e){document.getElementById("lista").textContent="Erro ao carregar: "+e.message;}
}
async function chamarTv(nome){
  const numero=prompt("Qual o número do guichê? Ex: 1","1");
  if(!numero) return;
  try{
    const r=await fetch("/tv/chamar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paciente:nome,localTipo:"GUICHÊ",localNumero:numero})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.erro||"Erro ao chamar");
    alert("Paciente enviado para o telão!");
  }catch(e){alert(e.message);}
}
async function excluirPaciente(id,nome){
  if(!confirm("Excluir "+nome+" da triagem?")) return;
  try{
    const r=await fetch("/triagens/"+id,{method:"DELETE"});
    const d=await r.json();
    if(!r.ok) throw new Error(d.erro||"Erro ao excluir");
    carregar();
  }catch(e){alert(e.message);}
}
carregar();
</script>
</body>
</html>
