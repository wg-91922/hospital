
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telão Hospitalar</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f1f3f6;
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
}

.tv-container {
    display: flex;
    width: 96vw;
    height: 92vh;
    gap: 18px;
    margin: 4vh auto;
}

.left-panel,
.right-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
}

.left-panel {
    width: 35%;
}

.right-panel {
    width: 65%;
}

.box {
    background: white;
    border: 5px solid #d4d9e1;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
    color: #333;
    padding: 20px;
    min-height: 0;
}

.box-title {
    color: #26364a;
    font-size: clamp(20px, 2.2vw, 38px);
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.local-box {
    flex: 1;
    background: #e8f0ff;
}

.local-number {
    color: #7928e8;
    font-size: clamp(60px, 9vw, 150px);
    font-weight: bold;
    overflow-wrap: anywhere;
}

.local-type {
    color: #26364a;
    font-size: clamp(20px, 2vw, 34px);
    font-weight: bold;
    margin-top: 6px;
}

.history-box {
    flex: 1;
    justify-content: flex-start;
    align-items: stretch;
    overflow: hidden;
}

.history-box .box-title {
    font-size: clamp(17px, 1.8vw, 28px);
    align-self: center;
}

#history-list {
    list-style: none;
    width: 100%;
    color: #26364a;
    font-size: clamp(14px, 1.5vw, 24px);
    font-weight: bold;
    text-align: left;
}

#history-list li {
    margin-bottom: 12px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 8px;
    overflow-wrap: anywhere;
}

.patient-box {
    flex: 3;
    background: white;
}

.patient-name {
    color: #7928e8;
    font-size: clamp(35px, 6.5vw, 100px);
    font-weight: bold;
    line-height: 1.2;
    overflow-wrap: anywhere;
}

.logo-box {
    flex: 1;
    background: #e8f0ff;
}

.logo-text {
    color: #7928e8;
    font-weight: bold;
    text-transform: uppercase;
    font-size: clamp(18px, 2vw, 30px);
}

.aguardando {
    color: #6b7280;
}

@keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
}

.flash {
    animation: flash .5s ease 3;
}

@media(max-width:600px) {
    .tv-container {
        width: 96vw;
        height: 94vh;
        margin: 3vh auto;
        gap: 8px;
    }

    .left-panel,
    .right-panel {
        gap: 8px;
    }

    .left-panel {
        width: 38%;
    }

    .right-panel {
        width: 62%;
    }

    .box {
        padding: 8px;
        border-width: 2px;
        border-radius: 10px;
    }
}
</style>
</head>

<body>

<div class="tv-container">

    <div class="left-panel">

        <div class="box local-box">

            <div class="box-title" id="local-tipo">
                GUICHÊ
            </div>

            <div class="local-number" id="local-numero">
                --
            </div>

        </div>

        <div class="box history-box">

            <div class="box-title">
                Últimas chamadas
            </div>

            <ul id="history-list"></ul>

        </div>

    </div>

    <div class="right-panel">

        <div class="box patient-box">

            <div class="box-title">
                Paciente
            </div>

            <div class="patient-name aguardando" id="patient-name">
                AGUARDANDO...
            </div>

        </div>

        <div class="box logo-box">

            <div class="logo-text">
                Sistema Hospitalar
            </div>

        </div>

    </div>

</div>

<script>

let ultimaChamadaId = null;

async function atualizar() {

    try {

        const resposta = await fetch("/tv/chamada", {
            cache: "no-store"
        });

        if (!resposta.ok) {
            throw new Error("Erro ao consultar chamadas.");
        }

        const data = await resposta.json();

        const chamada = data.chamada;
        const historico = data.historico || [];

        const patientName = document.getElementById("patient-name");
        const patientBox = document.querySelector(".patient-box");

        if (chamada) {

            document.getElementById("local-tipo").textContent =
                chamada.localTipo || "GUICHÊ";

            document.getElementById("local-numero").textContent =
                chamada.localNumero || "--";

            patientName.textContent =
                chamada.paciente || "AGUARDANDO...";

            patientName.classList.remove("aguardando");

            if (chamada.id !== ultimaChamadaId) {

                ultimaChamadaId = chamada.id;

                patientBox.classList.remove("flash");

                void patientBox.offsetWidth;

                patientBox.classList.add("flash");
            }

        } else {

            document.getElementById("local-tipo").textContent = "GUICHÊ";
            document.getElementById("local-numero").textContent = "--";

            patientName.textContent = "AGUARDANDO...";
            patientName.classList.add("aguardando");

        }

        const lista = document.getElementById("history-list");

        lista.innerHTML = "";

        historico.slice(0, 4).forEach(item => {

            const li = document.createElement("li");

            const tipo = item.localTipo || "GUICHÊ";
            const numero = item.localNumero || "--";
            const nome = item.paciente || "Paciente";

            li.textContent = `${tipo} ${numero} - ${nome}`;

            lista.appendChild(li);

        });

    } catch (erro) {

        console.error("Erro ao atualizar o telão:", erro);

    }

}

atualizar();

setInterval(atualizar, 2000);

</script>

</body>
</html>
